server.port=8081

# Application Branding
spring.application.name=portfolio-backend

# =====================================================================
# CORS Configuration (Driven by Environment Variable in Prod)
# =====================================================================
portfolio.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://portfolio-cmg6.vercel.app}

# =====================================================================
# Database Configuration (MySQL in Prod, H2 fallback for Local)
# =====================================================================
spring.datasource.url=${MYSQL_URL:jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.driverClassName=${MYSQL_DRIVER:org.h2.Driver}
spring.datasource.username=${MYSQL_USER:sa}
spring.datasource.password=${MYSQL_PASSWORD:}

# H2 Console Access (Disabled in Prod if driver is MySQL)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# MySQL Production Configuration (uncomment to switch to MySQL)
# =====================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.h2.console.enabled=false

# =====================================================================
# JPA / Hibernate Settings
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Logging Configuration
# =====================================================================
logging.level.org.springframework.web=INFO
logging.level.com.chaitanya.portfolio=DEBUG

# =====================================================================
# Security & Admin Configuration
# =====================================================================
portfolio.admin.username=${ADMIN_USERNAME:chaitanya4123}
portfolio.admin.password=${ADMIN_PASSWORD:chaitanya@@gubb}
portfolio.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
portfolio.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

