server.port=8081

# Application Branding
spring.application.name=portfolio-backend

# =====================================================================
# CORS Configuration (no hardcoded URLs in Java code)
# =====================================================================
portfolio.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# =====================================================================
# H2 In-Memory Database (MySQL Mode - Zero setup for development)
# Switch to MySQL for production by commenting this block and
# uncommenting the MySQL block below.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Access at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =====================================================================
# MySQL Production Configuration (uncomment to switch to MySQL)
# =====================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.h2.console.enabled=false

# =====================================================================
# JPA / Hibernate Settings
# =====================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Logging Configuration
# =====================================================================
logging.level.org.springframework.web=INFO
logging.level.com.chaitanya.portfolio=DEBUG
